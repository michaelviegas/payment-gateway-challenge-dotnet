services:
  bank_simulator:
    container_name: bank_simulator
    image: bbyars/mountebank:2.8.1
    ports:
      - "2525:2525"
      - "8080:8080"
    command: --configfile /imposters/bank_simulator.ejs --allowInjection
    volumes:
      - type: bind
        source: ./imposters
        target: /imposters

  payment_gateway:
    container_name: payment_gateway
    build: .
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Bank__BaseUrl: http://bank_simulator:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://observability:18889
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    depends_on:
      - bank_simulator
      - observability

  # Local stand-in for a tracing and metrics backend: receives OTLP and shows it at http://localhost:18888.
  observability:
    container_name: observability
    image: mcr.microsoft.com/dotnet/aspire-dashboard:9.0
    ports:
      - "18888:18888"
    environment:
      DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
