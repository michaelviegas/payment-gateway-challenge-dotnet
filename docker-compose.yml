services:
  bank_simulator:
    container_name: bank_simulator
    image: bbyars/mountebank:2.8.1
    ports:
      - "2525:2525"
      - "8080:8080"
    command: --configfile /imposters/bank_simulator.ejs --allowInjection
    volumes:
      - type: bind
        source: ./imposters
        target: /imposters

  payment_gateway:
    container_name: payment_gateway
    build: .
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Bank__BaseUrl: http://bank_simulator:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://observability:18889
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_EXPORTER_OTLP_HEADERS: x-otlp-api-key=local-dev-key
    depends_on:
      - bank_simulator
      - observability

  # Local stand-in for a tracing and metrics backend: receives OTLP and shows it at http://localhost:18888.
  observability:
    container_name: observability
    image: mcr.microsoft.com/dotnet/aspire-dashboard:9.0
    ports:
      - "18888:18888"
      # OTLP, so the API run from an IDE on the host can export here too.
      - "18889:18889"
    # The dashboard encrypts page state kept in the browser with keys stored in the container.
    # Persisting them stops open tabs failing to load after the container is recreated. Root
    # because the volume is root-owned and the image's default user can't write to it.
    user: root
    volumes:
      - dashboard_keys:/root/.aspnet/DataProtection-Keys
    environment:
      # UI stays open for local use; OTLP ingestion requires the key sent by payment_gateway.
      Dashboard__Frontend__AuthMode: Unsecured
      Dashboard__Otlp__AuthMode: ApiKey
      Dashboard__Otlp__PrimaryApiKey: local-dev-key

volumes:
  dashboard_keys:
